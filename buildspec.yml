version: 0.2

env:
  variables:
    PROJECT_NAME: r2sqs-eb

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - IMAGE_TAG=$(git rev-parse HEAD)
      - chmod +x scripts/detect_changes.sh
      - chmod +x scripts/deploy.sh
      - ./scripts/detect_changes.sh
      - export $(cat pipeline.env | xargs)
      - echo "========== PRE-BUILD START =========="

      # Fix line endings (CRLF → LF)
      - echo "Converting line endings to Unix format..."
      - find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} +
      - find . -type f -name "appspec.yml" -exec sed -i 's/\r$//' {} +
      - find . -type f -name "docker-compose.yml" -exec sed -i 's/\r$//' {} +

      # Ensure ECR repositories exist
      - echo "Ensuring ECR repositories exist..."
      - aws ecr describe-repositories --repository-names "$PROJECT_NAME-customer" --region $AWS_DEFAULT_REGION || aws ecr create-repository --repository-name "$PROJECT_NAME-customer" --region $AWS_DEFAULT_REGION
      - aws ecr describe-repositories --repository-names "$PROJECT_NAME-products" --region $AWS_DEFAULT_REGION || aws ecr create-repository --repository-name "$PROJECT_NAME-products" --region $AWS_DEFAULT_REGION
      - aws ecr describe-repositories --repository-names "$PROJECT_NAME-shopping" --region $AWS_DEFAULT_REGION || aws ecr create-repository --repository-name "$PROJECT_NAME-shopping" --region $AWS_DEFAULT_REGION
      - aws ecr describe-repositories --repository-names "$PROJECT_NAME-gateway" --region $AWS_DEFAULT_REGION || aws ecr create-repository --repository-name "$PROJECT_NAME-gateway" --region $AWS_DEFAULT_REGION

      # Login to ECR
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URL=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URL

      - echo "========== PRE-BUILD COMPLETE =========="

  build:
    commands:
      - |
        if [ "$RUN_BUILD" = "true" ]; then
          echo "========== BUILD START =========="
          echo "Build started on $(date)"
          
          build_service() {
            local service=$1
            if aws ecr describe-images --repository-name "$PROJECT_NAME-$service" --image-ids imageTag="$IMAGE_TAG" --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1; then
               echo "Image $PROJECT_NAME-$service:$IMAGE_TAG already exists. Skipping build."
            else
               if [ "$service" = "gateway" ]; then
                 docker build -t "$PROJECT_NAME-$service:$IMAGE_TAG" ./gateway
               else
                 docker build -f "$service/Dockerfile" -t "$PROJECT_NAME-$service:$IMAGE_TAG" .
               fi
               docker tag "$PROJECT_NAME-$service:$IMAGE_TAG" "$ECR_URL/$PROJECT_NAME-$service:$IMAGE_TAG"
               docker tag "$PROJECT_NAME-$service:$IMAGE_TAG" "$ECR_URL/$PROJECT_NAME-$service:latest"
            fi
          }
          
          build_service "customer"
          build_service "products"
          build_service "shopping"
          build_service "gateway"
          
          echo "========== BUILD COMPLETE =========="
        else
          echo "Skipping Build"
        fi

  post_build:
    commands:
      - echo IMAGE_TAG=$IMAGE_TAG > image.env
      - |
        if [ "$RUN_DEPLOY" = "true" ] || [ "$RUN_BUILD" = "true" ]; then
          echo "========== PUSH START =========="
          
          push_service() {
            local service=$1
            if aws ecr describe-images --repository-name "$PROJECT_NAME-$service" --image-ids imageTag="$IMAGE_TAG" --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1; then
               echo "Image $PROJECT_NAME-$service:$IMAGE_TAG already in ECR. Skipping push."
            else
               docker push "$ECR_URL/$PROJECT_NAME-$service:$IMAGE_TAG"
               docker push "$ECR_URL/$PROJECT_NAME-$service:latest"
            fi
          }
          
          push_service "customer"
          push_service "products"
          push_service "shopping"
          push_service "gateway"
          
          echo "========== PUSH COMPLETE =========="
        else
          echo "Skipping Deploy"
        fi

artifacts:
  files:
    - appspec.yml
    - docker-compose.yml
    - scripts/deploy.sh
    - image.env
  discard-paths: no 